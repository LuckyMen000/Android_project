name: TaskBar Android RGR3

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Lint + Detekt + JUnit + JaCoCo 70%
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build, static analysis, unit tests and 70% domain coverage
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:detekt :app:testDebugUnitTest :app:rgr3CoverageVerify --stacktrace
      - name: Upload JVM and lint reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-static-unit-reports
          if-no-files-found: warn
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/unit_test_code_coverage/**
            app/build/outputs/apk/debug/*.apk

  instrumented:
    name: Room + Compose/Espresso on API 34
    needs: static-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation reports and on-device coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-android-test-reports
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/outputs/code_coverage/**
            app/build/outputs/apk/androidTest/**
